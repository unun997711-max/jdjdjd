          class PerformanceMonitor {
            constructor() {
              this.samples = [];
              this.maxSamples = 90;
              this.fps = 60;
              this.frameTime = 16.67;
              this.lowFrameCount = 0;
              this.highFrameCount = 0;
              this.qualityLevel = 2;
            }
          
            record(deltaSeconds) {
              const milliseconds = deltaSeconds * 1000;
              this.samples.push(milliseconds);
          
              if (this.samples.length > this.maxSamples) {
                this.samples.shift();
              }
          
              const total = this.samples.reduce((sum, value) => sum + value, 0);
              this.frameTime = total / this.samples.length;
              this.fps = 1000 / Math.max(0.1, this.frameTime);
          
              if (this.fps < 27) {
                this.lowFrameCount++;
                this.highFrameCount = 0;
              } else if (this.fps > 48) {
                this.highFrameCount++;
                this.lowFrameCount = 0;
              } else {
                this.lowFrameCount = Math.max(0, this.lowFrameCount - 1);
                this.highFrameCount = Math.max(0, this.highFrameCount - 1);
              }
          
              return this.fps;
            }
          
            shouldReduceQuality() {
              return this.lowFrameCount > 120;
            }
          
            shouldIncreaseQuality() {
              return this.highFrameCount > 240;
            }
          
            resetCounters() {
              this.lowFrameCount = 0;
              this.highFrameCount = 0;
            }
          }
          
          class CollisionMath {
            static circleCircle(a, radiusA, b, radiusB) {
              const dx = b.x - a.x;
              const dz = b.z - a.z;
              const distanceSquared = dx * dx + dz * dz;
              const combined = radiusA + radiusB;
              return distanceSquared < combined * combined;
            }
          
            static resolveCircleCircle(a, radiusA, b, radiusB) {
              const dx = b.x - a.x;
              const dz = b.z - a.z;
              const distance = Math.hypot(dx, dz) || 0.0001;
              const overlap = radiusA + radiusB - distance;
          
              if (overlap <= 0) return 
